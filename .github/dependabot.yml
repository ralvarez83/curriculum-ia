version: 2

# Sin esto, una vulnerabilidad en una dependencia sólo se descubre por
# casualidad: fue lo que pasó con los avisos de Astro 6 durante la migración.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Un solo PR para las actualizaciones menores y de parche: casi siempre
      # se revisan juntas y así no llenan la lista.
      menores:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'Actualiza'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'Actualiza'
