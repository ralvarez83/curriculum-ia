# El sitio se compila en GitHub Actions y se sube ya construido con la CLI de
# Netlify (ver .github/workflows/deploy.yml), así que Netlify no ejecuta el
# build. La sección [build] sólo indica qué se publica.
[build]
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los recursos con huella en el nombre no cambian nunca: se cachean para siempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
